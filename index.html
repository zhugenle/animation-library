<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>番剧简案立项库</title><link rel="preload" href="./fonts/SourceHanSerifCN-Heavy.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head>
<body>
<a class="skip" href="#main">跳转到正文</a>
<header class="masthead"><a class="brand" href="#"><span>番剧简案立项库<small>ANIMATION PROJECT LIBRARY</small></span></a><div class="mast-right"><span>Codex × antigravtiy</span><span id="sync" role="status">正在连接文库</span></div></header>
<div class="shell">
<aside class="sidebar"><div class="side-title">馆藏导航 <span>COLLECTIONS</span></div><nav id="nav" aria-label="文库分类"></nav><div class="tree-label">选题方向</div><div id="tree"></div><footer>共享创意，持续生长。<br><span>公开简案文库</span><br><button id="refresh" class="text-button">立即同步</button></footer></aside>
<main id="main" tabindex="-1"><div id="overview"><div class="page-top"><p id="summary" class="summary">正在读取馆藏…</p></div>
<div class="toolbar"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="检索题名、设定与文件内容" aria-label="检索文库"><kbd>/</kbd></label><label class="filter-label">方向<select id="lane" aria-label="按选题方向筛选"><option value="">全部方向</option></select></label><label class="filter-label">排序<select id="sort" aria-label="排序"><option value="default">馆藏顺序</option><option value="newest">最近更新</option><option value="title">题名</option></select></label></div>
<div id="brief-filters" class="brief-filters" role="group" aria-label="简案制作状态"></div><div class="section-line"><h2 id="section-title">全部选题</h2><span id="count"></span></div><div id="results" aria-live="polite"></div></div>
<section id="reader" hidden><div class="reader-bar"><button id="back" class="text-button">← 返回馆藏</button><div><span id="topic-actions"></span><button id="raw-toggle" class="text-button">查看原文</button><button id="copy" class="text-button">复制链接</button></div></div><p id="file-path" class="file-path"></p><div class="read-meta" id="read-meta"></div><article id="document"></article><div id="read-end">公开简案 · 内容随发布更新</div></section>
<p id="message" role="status"></p></main></div><div id="toast" role="status"></div>
</body></html>
